# ==============================================================================
# Google Cloud Build Pipeline - OncoGemma v5 Zero-Local-Compute Deployment
# Builds, tests, pushes Docker images to Artifact Registry, and deploys to Cloud Run.
# ==============================================================================
steps:
  # 1. Build Backend API Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/oncogemma-repo/api:latest'
      - '-f'
      - 'ops/docker/Dockerfile.api'
      - '.'
    id: 'build-api'

  # 2. Build Worker Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/oncogemma-repo/worker:latest'
      - '-f'
      - 'ops/docker/Dockerfile.worker'
      - '.'
    id: 'build-worker'

  # 3. Build Next.js Frontend Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/oncogemma-repo/frontend:latest'
      - '--build-arg=NEXT_PUBLIC_AUTH_ENABLED=1'
      - '--build-arg=NEXT_PUBLIC_GOOGLE_CLIENT_ID=$_GOOGLE_OAUTH_CLIENT_ID'
      - '--build-arg=NEXT_PUBLIC_AUTH_DOMAIN_HINT=$_AUTH_DOMAIN_HINT'
      - '-f'
      - 'ops/docker/Dockerfile.frontend'
      - '.'
    id: 'build-frontend'

  # 4. Push Container Images to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '$_REGION-docker.pkg.dev/$PROJECT_ID/oncogemma-repo/api:latest']
    id: 'push-api'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '$_REGION-docker.pkg.dev/$PROJECT_ID/oncogemma-repo/worker:latest']
    id: 'push-worker'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '$_REGION-docker.pkg.dev/$PROJECT_ID/oncogemma-repo/frontend:latest']
    id: 'push-frontend'

  # 5. Deploy FastAPI Control Plane to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'oncogemma-api'
      - '--image=$_REGION-docker.pkg.dev/$PROJECT_ID/oncogemma-repo/api:latest'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances=$PROJECT_ID:$_REGION:oncogemma-dev-psql'
      - '--cpu=4'
      - '--memory=8Gi'
      - '--no-cpu-throttling'
      - '--min-instances=1'
      # Sign-in (SPEC-03 §3): the API refuses to start without the OAuth client ID and the session key.
      # '^|^' makes '|' the separator, so AUTH_ALLOWED_DOMAINS may hold a comma-separated list.
      - '--update-env-vars=^|^CLOUD_SQL_CONNECTION_NAME=$PROJECT_ID:$_REGION:oncogemma-dev-psql|GOOGLE_OAUTH_CLIENT_ID=$_GOOGLE_OAUTH_CLIENT_ID|AUTH_ALLOWED_DOMAINS=$_AUTH_ALLOWED_DOMAINS|BOOTSTRAP_ADMIN_EMAIL=$_BOOTSTRAP_ADMIN_EMAIL'
      - '--set-secrets=DB_PASSWORD=og-db-password:latest,SESSION_SIGNING_KEY=og-session-signing-key:latest'
    id: 'deploy-api'

  # 6. Deploy Next.js Frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'oncogemma-frontend'
      - '--image=$_REGION-docker.pkg.dev/$PROJECT_ID/oncogemma-repo/frontend:latest'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--cpu=1'
      - '--memory=1Gi'
      - '--cpu-throttling'
      - '--min-instances=0'
    id: 'deploy-frontend'

  # 7. Update Worker Cloud Run Job
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - 'oncogemma-worker-job'
      - '--image=$_REGION-docker.pkg.dev/$PROJECT_ID/oncogemma-repo/worker:latest'
      - '--region=$_REGION'
      - '--add-cloudsql-instances=$PROJECT_ID:$_REGION:oncogemma-dev-psql'
      - '--update-env-vars=CLOUD_SQL_CONNECTION_NAME=$PROJECT_ID:$_REGION:oncogemma-dev-psql'
      - '--set-secrets=DB_PASSWORD=og-db-password:latest'
    id: 'update-worker-job'

substitutions:
  _REGION: 'us-central1'
  # Sign-in settings for deploy-api; pass with --substitutions. An empty client ID stops the API at startup.
  _GOOGLE_OAUTH_CLIENT_ID: ''
  _AUTH_ALLOWED_DOMAINS: ''
  _BOOTSTRAP_ADMIN_EMAIL: ''

options:
  logging: CLOUD_LOGGING_ONLY
