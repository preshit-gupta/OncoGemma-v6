# OncoGemma Automated Slide Quality Control (QC) Configuration
# PRD 02-stage-v4.1-preprocess-qc §3.1 Automated Pre-Flight Checks

# Tissue area and the focus thresholds depend on the specimen type: configs/specimen_profiles.yaml (qc).

overview:
  mpp: 8.0  # pen-mark and fold checks read the whole slide at this resolution

focus:
  mpp: 1.0  # tiles are read at ~10x
  tile_size_px: 512  # 512 x 512 µm tiles at 1.0 µm/px
  sample_max_tiles: 400  # sampled uniformly over the tissue mask
  min_tissue_fraction: 0.5  # a tile must be at least half tissue

resolution:
  warn_native_mpp: 0.30  # coarser than this: the slide is upsampled for mitosis detection (SPEC-04 §3.7)
  fail_native_mpp: 0.55  # coarser than this (below ~20x): mitosis counting is not supported

pen_marks:
  min_component_area_mm2: 1.0  # Connected components > 1.0 mm² trigger warning
  hsv_ranges:
    green:
      h_min: 35
      h_max: 85
      s_min: 60
      v_min: 60
    blue:
      h_min: 90
      h_max: 130
      s_min: 60
      v_min: 60
    black:
      h_min: 0
      h_max: 180
      s_min: 0
      s_max: 50
      v_min: 0
      v_max: 50

folds:
  min_skeleton_length_mm: 2.0  # Morphological skeleton > 2.0 mm triggers warning
  saturation_min: 160          # High saturation ridge
  brightness_max: 100          # Low brightness ridge

stain_sanity:
  min_concentration: 0.15      # Faded stain threshold
  he_ratio_min: 0.1            # H:E concentration ratio lower bound
  he_ratio_max: 5.0            # H:E concentration ratio upper bound
