# Per-specimen-type settings (SPEC-04 §3.2). Values are proposals, tuned on the validation splits in P1.
# The case's specimen_type picks the profile. This file is part of PipelineConfig and its hash.
schema_version: 1

profiles:
  resection:
    tissue_mask:
      mpp: 8.0 # the mask is computed at this resolution over the full slide extent
      otsu_clip: [215, 235] # the Otsu grey threshold is clipped to this range
      sat_min: 12 # HSV saturation (0-255) above this is tissue however light
      open_radius_um: 48.0 # binary opening removes tissue narrower than twice this
      min_component_um2: 200000.0 # smaller tissue fragments are dust
      fill_holes_max_um2: 40000.0 # smaller holes in tissue are filled
    stain_fit:
      n_patches: 50 # valid patches the fit stops at
      n_candidates: 150 # tissue positions offered to the fitter
      patch_um: 512.0 # 512 x 512 µm ...
      fit_mpp: 1.0 # ... read at ~10x
      min_sat_mean: 0.05 # patch mean HSV saturation below this is glass or fat
      sparse_below: 10 # fewer valid patches than this: fit_status 'sparse'
      od_beta: 0.15 # stained-tissue pixel: some channel optical density >= this; the transform passes the rest through
      angle_percentile: 1.0 # Macenko stain-vector angle percentile
      conc_percentile: 99.0 # concentration percentile taken as each stain's maximum
      min_angle_spread_rad: 0.25 # tissue pixels must span this angle in the stain plane, else the fit is degenerate
      min_tissue_pixels: 5000 # fewer stained pixels than this in the mosaic: degenerate
    stain_target:
      ref: v5_patch@v1 # replaced by tcga_train_median@v1 once the SPEC-02 train split exists
    norm_pyramid:
      max_mpp: 1.0 # the normalised layer covers zoom levels down to ~10x
      max_tiles: 1500 # ... and stops earlier when it would exceed this many tiles
    qc:
      tissue_area_fail_mm2: 4.0 # less tissue than this fails QC
      tissue_area_warn_mm2: 20.0
      focus_vol_threshold: 45.0 # variance of the Laplacian below this: blurry tile
      focus_fail_ratio: 0.30 # more blurry tissue tiles than this fails QC
      focus_warn_ratio: 0.10
    triage:
      min_tissue_fraction: 0.25 # a 224 µm grid tile is embedded when at least this fraction of it is tissue (SPEC-05 §3)
    hotspots:
      hpf_diameter_um: 500.0 # an HPF is a circle 0.5 mm across (0.196 mm²; D22)
      frame_padding_um: 50.0 # its frame is the square around it plus this on each side: 600 µm
      lattice_step_um: 125.0 # site lattice step d/4 over the bounding box of the tumour mask
      min_tissue_fraction: 0.70 # tissue share of the circle
      min_tumor_fraction: 0.50 # area-weighted tumour tile share of the circle
      gap_um: 0.0 # least distance between circle edges
      k_max: 10 # HPFs to examine; fewer is inadequate tissue
      ranking_arm: H1P # periphery first, then mean p_tumor_cal over the circle (owner, 2026-10-05, D22); H1 = score only, for ablations
      periphery_band_um: 1000.0 # invasive-front band, inward from the front (owner, 2026-10-05, D22)
    grading:
      tubule_patches: 48 # SPEC-07 §5.1; drawn inside the confirmed hotspots (owner decision 2026-10-02), may overlap
      pleo_fields: 48 # SPEC-07 §6.1; non-overlapping, inside a hotspot

  core_biopsy:
    tissue_mask:
      mpp: 4.0 # cores are a millimetre wide: a finer mask and gentler clean-up than a resection
      otsu_clip: [215, 235]
      sat_min: 12
      open_radius_um: 12.0
      min_component_um2: 20000.0
      fill_holes_max_um2: 10000.0
    stain_fit:
      n_patches: 30
      n_candidates: 90
      patch_um: 256.0
      fit_mpp: 1.0
      min_sat_mean: 0.05
      sparse_below: 8
      od_beta: 0.15
      angle_percentile: 1.0
      conc_percentile: 99.0
      min_angle_spread_rad: 0.25
      min_tissue_pixels: 5000
    stain_target:
      ref: v5_patch@v1
    norm_pyramid:
      max_mpp: 1.0
      max_tiles: 1500
    qc:
      tissue_area_fail_mm2: 0.5
      tissue_area_warn_mm2: 2.0
      focus_vol_threshold: 45.0
      focus_fail_ratio: 0.30
      focus_warn_ratio: 0.10
    triage:
      min_tissue_fraction: 0.25
    hotspots:
      hpf_diameter_um: 500.0 # an HPF is a circle 0.5 mm across (0.196 mm²; D22)
      frame_padding_um: 50.0 # its frame is the square around it plus this on each side: 600 µm
      lattice_step_um: 125.0 # site lattice step d/4 over the bounding box of the tumour mask
      min_tissue_fraction: 0.70 # tissue share of the circle
      min_tumor_fraction: 0.50 # area-weighted tumour tile share of the circle
      gap_um: 0.0 # least distance between circle edges
      k_max: 10 # HPFs to examine; fewer is inadequate tissue
      ranking_arm: H1P # periphery first, then mean p_tumor_cal over the circle (owner, 2026-10-05, D22); H1 = score only, for ablations
      periphery_band_um: 1000.0 # invasive-front band, inward from the front (owner, 2026-10-05, D22)
    grading:
      tubule_patches: 24 # SPEC-07 §5.1
      pleo_fields: 32 # SPEC-07 §6.1
