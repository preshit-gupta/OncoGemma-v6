# OncoGemma Stage v4.3 - Mitosis Detection, Virtual HPFs & Scoring Configuration

# Stage A (SPEC-06 §5.1-5.2). Tiles are the detector's 512 px inputs at 0.25 um/px (slides at
# another resolution are resampled). Each tile owns the half of every 64 px overlap nearest to it,
# so a detection is kept once. KongNet serves at native 40x: F1 0.87 on MIDOG++ image 094, versus
# at most 0.27 at the 0.5 um/px of its TIAToolbox IO config (2026-09-29).
detector:
  producer: kongnet_det_midog_1 # configs/models.yaml
  tile_size_px: 512
  mpp: 0.25 # 40x magnification (~0.25 um/pixel)
  tile_size_um: 128.0 # 512 * 0.25
  stride_px: 448 # 64 px overlap across tiles
  overlap_px: 64
  min_prob: 0.01 # sent to the detector; candidates are stored raw from here (threshold sweeps)
  # Set from the MIDOG++ 094 baseline (reports/baseline/mitosis_midogpp_094.md, 2026-09-30): best F1
  # 0.862 at tau 0.75 with NMS 5-12.5 um; the old 0.35 / 20 um gave 0.831 (20 um merges true figures).
  det_threshold: 0.75 # applied to the raw candidates
  region_margin_um: 16.0 # sweep region = hotspot bounding box grown by this (SPEC-06 §5.1)
  min_tissue_fraction: 0.20 # a sweep tile must be at least this much tissue (registered mask)
  nms_radius_um: 7.5 # greedy NMS radius (SPEC-06 §5.7 candidates 5-12.5 um; all equal on 094)

# The VLM referee for every candidate, when enabled (SPEC-06 arm A2: v5 prompt, strict MitosisVerdict).
referee:
  # Off (SPEC-06 arm A1). On MIDOG++ 094 the referee (v5 prompt) cut F1 from 0.862 to 0.676: it
  # rejected 25 true figures (recall 0.915 -> 0.610) and removed one net false positive (McNemar p < 0.001).
  enabled: false
  producer: gemini_referee
  prompt: mitosis_confirmation@v1.md
  focus_px: 128 # focus crop ...
  focus_mpp: 0.25 # ... at 0.25 um/px: 32 um across on every scanner (a 20x slide is upsampled)
  color: normalized # SPEC-04 §3.5 default for VLM tasks; the raw-vs-normalised ablation decides per task
  context_um: 512.0 # context field ...
  context_px: 512 # ... resampled to ~1.0 um/px

# Tumour-cell gate (SPEC-06 §5.5): a candidate counts only when its tile, in the triage tumour mask dilated by
# dilation_tiles grid tiles (224 um each), is tumour. A pathologist's 'mitosis' label still counts. The in-situ
# clause waits for a tumour head with an in-situ class (tumor_head@1.0.0 has none). Off only for an eval ablation:
# a clinical run refuses enabled: false.
tumor_gate:
  enabled: true
  dilation_tiles: 1

# Review images of every persisted candidate (contract mitosis_v6 crop_url / context_url), raw colour, PNG.
review_crops:
  crop_um: 64.0 # crop: 64 um ...
  crop_mpp: 0.25 # ... at 0.25 um/px (256 px)
  context_um: 256.0 # context: 256 um ...
  context_mpp: 1.0 # ... at 1.0 um/px (256 px)

# The HPFs are the confirmed Stage 3 sites: circles of specimen_profiles.<type>.hotspots.hpf_diameter_um at
# their centres (D22). Only the review image is set here; it covers the site's frame.
hpf:
  review_px: 2048 # the frame rendered 2048 px square (~0.29 um/px)

scoring:
  basis: "per_mm2"
  thresholds:
    score2_min: 3.65 # mitoses/mm² (classic 10-19 / 2.74 mm²)
    score3_min: 7.30 # mitoses/mm² (classic >=20 / 2.74 mm²)
  display_classic_equivalent: true
  classic_area_mm2: 2.74
