# OncoGemma Stage v4.3 - Mitosis Detection, Virtual HPFs & Scoring Configuration

detector:
  producer: kongnet_det_midog_1 # configs/models.yaml; each tile is split into its 512 px inputs
  tile_size_px: 1024
  mpp: 0.25 # 40x magnification (~0.25 um/pixel)
  tile_size_um: 256.0 # 1024 * 0.25
  stride_px: 960 # 64 px overlap across tiles
  overlap_px: 64
  det_threshold: 0.35 # Candidate sweep threshold, sent to the detector as min_prob
  nms_radius_um: 20.0 # Cross-tile greedy NMS suppression radius (MIDOG standard: 15-20 um cell diameter)
  min_tissue_fraction: 0.20 # a sweep tile must be at least this much tissue (v5 code default)

# Every candidate is adjudicated by this VLM (SPEC-06 arm A2: v5 prompt, strict MitosisVerdict).
referee:
  producer: gemini_referee
  prompt: mitosis_confirmation@v1.md
  focus_px: 128 # focus crop ...
  focus_mpp: 0.25 # ... at 0.25 um/px: 32 um across on every scanner (a 20x slide is upsampled)
  color: normalized # SPEC-04 §3.5 default for VLM tasks; the raw-vs-normalised ablation decides per task
  context_um: 512.0 # context field ...
  context_px: 512 # ... resampled to ~1.0 um/px

hpf:
  radius_um: 262.0 # 250-270 um field radius (area ≈ 0.2157 mm²)
  count: 10 # 10 non-overlapping fields (cumulative area ≈ 2.157 mm²)
  density_grid_res_um: 16.0 # Spatial density sampling resolution
  min_separation_um: 524.0 # 2 * radius_um (strict non-overlap)
  relaxed_min_separation_um: 393.0 # 1.5 * radius_um (overlap relaxation for constrained tumor margins)
  min_tissue_coverage: 0.70 # minimum tissue fraction inside an HPF (v5 code default)
  review_field_um: 577.29 # review image width: the viewer's 520 px canvas shows a 236 px reticle for radius_um (520 * 262 / 236)
  review_px: 2048 # ... rendered 2048 px square (~0.28 um/px)

scoring:
  basis: "per_mm2"
  thresholds:
    score2_min: 3.65 # mitoses/mm² (classic 10-19 / 2.74 mm²)
    score3_min: 7.30 # mitoses/mm² (classic >=20 / 2.74 mm²)
  display_classic_equivalent: true
  classic_area_mm2: 2.74
