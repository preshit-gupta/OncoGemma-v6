# Model registry (SPEC-01 §3.7). Validated into app.core.model_registry.ModelRegistry
# as part of PipelineConfig, so every change here changes config_hash.
#
# ${NAME} takes the value of Settings.NAME (allowed names: REGISTRY_VARIABLES in
# app/core/pipeline_config.py). An unset or empty value becomes null.
#
# Vertex endpoint versions are "models/<model id>@<model version>@<deploy date>", read with
#   gcloud ai endpoints describe <endpoint id> --region=us-central1 --project=oncogemma
# (verified 2026-09-28; each endpoint serves exactly one deployed model). Redeploying a
# model means updating its version here.
schema_version: 1

# How the gateway calls every model (SPEC-01 §3.4). Only transport errors are retried
# (HTTP 429/500/502/503/504, DEADLINE_EXCEEDED, UNAVAILABLE), with exponential backoff and
# full jitter. An entry's limits (or its max_attempts / deadline_s) override the defaults.
call_policy:
  default_max_attempts: 4
  default_deadline_s: 120.0
  backoff_base_s: 1.0
  backoff_cap_s: 30.0

models:
  path_foundation:
    kind: embedding
    provider: vertex_endpoint_raw_predict
    wire_format: path_foundation_v1
    endpoint_id: ${VERTEX_PATH_FOUNDATION_ENDPOINT_ID}
    region: ${VERTEX_PATH_FOUNDATION_LOCATION}
    version: "models/5848531596314935296@1@2026-09-22"   # google_path-foundation
    requires_image: true
    # Raw scanner colour: Path Foundation was trained on unnormalised H&E (owner decision 2026-10-02).
    # `normalized` is supported (tiles through the slide's stain transform, own cache per stain mapping)
    # and can be switched on once WP-6.2 shows it helps S3-F1 on val.
    input: {mpp: 1.0, mpp_tolerance: 0.02, size_px: [224, 224], color: raw, format: png}
    output_schema: EmbeddingBatch       # (N, 384) float32
    # v5 sent at most 6 images and 1.25 MB of base64 per request. qps is not enforced yet (SPEC-02 §6.2).
    limits: {max_batch: 6, max_request_bytes: 1250000, qps: 8.0, deadline_s: 60.0, max_attempts: 4}

  triage_probe:                         # v5 synthetic development probe; replaced by tumor_head (SPEC-05)
    kind: classifier
    provider: local_sklearn
    artifact_uri: models/probe/probe_v1.joblib
    artifact_sha256: 3093ac4158633a05b8c570f479c2d448d0bf25beeb2fce77b90641ac75409734
    version: "probe_v1"
    input: {features: path_foundation}
    output_schema: ClassProbabilities

  kongnet_det_midog_1:
    kind: detector
    # The v2 service contract (SPEC-06 §4, MIDOG-microservice). Raw predict, because Vertex's
    # predict response drops the model_sha256 each answer must carry (weights_sha256 below).
    provider: vertex_endpoint_raw_predict
    wire_format: kongnet_midog_v2
    endpoint_id: ${VERTEX_MITOSIS_ENDPOINT_ID}
    region: ${VERTEX_MITOSIS_LOCATION}
    version: "models/831662348912558080@1@2026-09-29"   # midog-kongnet-v2-d788edf (MIDOG-microservice #2), on the T4
    # KongNet_Det_MIDOG_1.pth as the image build recorded it (tiatoolbox 2.0.1).
    weights_sha256: "978afb3313963eca54ab9afd00c1b5febc485d6c908afeadb5b992844fab6198"
    requires_image: true
    input: {mpp: 0.25, mpp_tolerance: 0.01, size_px: [512, 512], color: raw, format: png}
    output_schema: DetectionList        # [{x, y, prob}] in input-pixel coordinates
    # Lossless PNG patches are ~0.3-0.5 MB, so few fit in one online-prediction request.
    limits: {max_batch: 4, max_request_bytes: 1250000, qps: 8.0, deadline_s: 60.0, max_attempts: 4}

  gemini_referee:
    kind: vlm
    provider: vertex_genai
    model: ${GEMINI_REFEREE_MODEL}
    region: ${GCP_REGION}
    requires_image: true
    params: {temperature: 0.0}

  # Ground-truth grades from TCGA pathology reports (SPEC-02 §4, eval only). Text in, no image;
  # the report goes in its own delimited part (SPEC-03 §5.2). Same Gemini release as the referee.
  gemini_labeler:
    kind: vlm
    provider: vertex_genai
    model: ${GEMINI_REFEREE_MODEL}
    region: ${GCP_REGION}
    requires_image: false
    params: {temperature: 0.0}

  medgemma:
    kind: vlm
    provider: vertex_endpoint_predict
    # Verified 2026-09-28 with one test call: Model Garden vLLM (pytorch-vllm-serve), chat completions.
    wire_format: medgemma_chat_v1
    endpoint_id: ${VERTEX_MEDGEMMA_ENDPOINT_ID}
    region: ${VERTEX_MEDGEMMA_LOCATION}
    version: "models/885564806952648704@1@2026-09-22"    # google_medgemma-1_5-4b-it-l4
    requires_image: true
    params: {temperature: 0.0, max_output_tokens: 512}

# Non-learned v5 producers, kept only for ablation replays (SPEC-06 §6.2 A0). No stage calls them.
heuristics:
  od_hyperchromatic_sweep: {version: "v5-2b87ab7", module: pipeline.heuristics.od_sweep}
  morph_verifier: {version: "v5-2b87ab7", module: pipeline.heuristics.morph_verifier}
