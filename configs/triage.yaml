# v4.2 Hotspot Triage Configuration
mpp_target: 1.0 # 10x magnification (~1.0 µm/px)
patch_size_px: 224 # 224x224 patch grid
tissue_threshold_pct: 0.25 # Keep patch if >= 25% tissue mask coverage
max_sample_patches: 2048 # High-resolution Smart Scout tissue sampling for Path Foundation (non-overlapping)

# Registry keys (configs/models.yaml), which also hold versions, request limits and artifacts.
embedding_model: path_foundation # 224x224 tile embeddings at 1.0 µm/px
tumor_model: triage_probe # classifier over the embeddings

# VLM check of candidate hotspots before the top max_hotspots are kept (SPEC-05 §5.4 arm).
tumor_referee:
  producer: medgemma
  prompt: tumor_verification@v2.md
  candidates: 20
  field_um: 512.0 # 512 x 512 µm field ...
  size_px: 512 # ... at ~1.0 µm/px, as the prompt states
  color: raw # the v5 input; SPEC-05 decides the tumour referee's colour

hotspot_extraction:
  sigma: 1.0 # Gaussian filter smoothing (~100 µm radius)
  prob_threshold: 0.45 # Probability threshold for binarization
  min_area_mm2: 0.20 # Standard HPF area
  max_hotspots: 10 # Top 10 standardized HPF sites
  margin_um: 40.0 # Dilation margin in micrometers
  simplify_tolerance_um: 20.0 # Polygon boundary simplification tolerance
