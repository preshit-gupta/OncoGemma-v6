# OncoGemma Clinical Scoring Configuration

mitotic_score:
  basis: per_mm2
  # Elston-Ellis thresholds mapped to mm² (standard 10 HPFs = 2.74 mm² or 2.157 mm² computed area)
  thresholds:
    score2_min: 3.65 # mitoses/mm²
    score3_min: 7.30 # mitoses/mm²
  display_classic_equivalent: true

tubule_formation:
  thresholds:
    score1_min_percent: 75.0 # >75% glandular structures
    score2_min_percent: 10.0 # 10-75% glandular structures
    # <10% -> score 3

nottingham_grading:
  # Grade 1: 3-5
  # Grade 2: 6-7
  # Grade 3: 8-9
  grade1_max_sum: 5
  grade2_max_sum: 7

grading:
  # Stage 5 samples (SPEC-07 §4-6); the counts are per specimen profile (specimen_profiles.yaml grading).
  tubule_sample: {size_um: 512.0, mpp: 1.0} # low power for architecture (SPEC-07 §5.1)
  pleo_field: {size_um: 128.0, mpp: 0.25} # 40x for nuclei (SPEC-07 §6.1)
  subdivisions: 8 # a 224 µm tumour tile gives 8 x 8 candidate centres 28 µm apart
  kmeans_n_init: 4 # weighted k-means restarts (seeded by the slide SHA-256)
  pleo_tie_break: max # tied pleomorphism mode takes the highest score (owner decision 2026-10-04)
  override_min_reason_chars: 10 # a component override needs a written reason this long (contract grading_v6)
  # The VLM that estimates each component (configs/models.yaml) and the prompt per task.
  # v5 prompts with strict output schemas and no numeric anchor (SPEC-07 §5.4).
  estimators:
    producer: gemini_referee
    tubule_prompt: tubule@v1.md
    pleo_prompt: pleo@v1.md
    histotype_prompt: histologic_type@v1.md
    histotype_images: 6 # the first patches, shown together (v5 sent 6 to Gemini)
    color: normalized # SPEC-04 §3.5 default for VLM tasks; the raw-vs-normalised ablation decides per task

hpf:
  radius_um: 262.0 # 250-270 um field radius (area ≈ 0.2157 mm²)
  count: 10
