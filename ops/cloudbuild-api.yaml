steps:
  # 1. Build Backend API Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/oncogemma-repo/api:latest'
      - '-f'
      - 'ops/docker/Dockerfile.api'
      - '.'
    id: 'build-api'

  # 2. Push Container Image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '$_REGION-docker.pkg.dev/$PROJECT_ID/oncogemma-repo/api:latest']
    id: 'push-api'

  # 3. Deploy FastAPI Control Plane to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'oncogemma-api'
      - '--image=$_REGION-docker.pkg.dev/$PROJECT_ID/oncogemma-repo/api:latest'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances=$PROJECT_ID:$_REGION:oncogemma-dev-psql'
      - '--cpu=4'
      - '--memory=8Gi'
      - '--no-cpu-throttling'
      - '--min-instances=1'
      - '--timeout=3600'
      # '^|^' makes '|' the separator, so AUTH_ALLOWED_DOMAINS may hold a comma-separated list.
      - '--update-env-vars=^|^VERTEX_MITOSIS_ENDPOINT_ID=6276949705008087040|VERTEX_MITOSIS_LOCATION=us-central1|GEMINI_REFEREE_MODEL=gemini-2.5-flash|VERTEX_MEDGEMMA_ENDPOINT_ID=2026818294165536768|VERTEX_MEDGEMMA_LOCATION=us-central1|VERTEX_PATH_FOUNDATION_ENDPOINT_ID=6638504312592924672|VERTEX_PATH_FOUNDATION_LOCATION=us-central1|CLOUD_SQL_CONNECTION_NAME=$PROJECT_ID:$_REGION:oncogemma-dev-psql|GOOGLE_OAUTH_CLIENT_ID=$_GOOGLE_OAUTH_CLIENT_ID|AUTH_ALLOWED_DOMAINS=$_AUTH_ALLOWED_DOMAINS|BOOTSTRAP_ADMIN_EMAIL=$_BOOTSTRAP_ADMIN_EMAIL'
      - '--set-secrets=DB_PASSWORD=og-db-password:latest,SESSION_SIGNING_KEY=og-session-signing-key:latest'
    id: 'deploy-api'


substitutions:
  _REGION: 'us-central1'
  # Sign-in (SPEC-03 §3); pass with --substitutions. An empty client ID stops the API at startup.
  _GOOGLE_OAUTH_CLIENT_ID: ''
  _AUTH_ALLOWED_DOMAINS: ''
  _BOOTSTRAP_ADMIN_EMAIL: ''

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
