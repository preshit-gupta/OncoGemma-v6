steps:
  # 1. Build Next.js Frontend Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/oncogemma-repo/frontend:latest'
      - '--build-arg=NEXT_PUBLIC_AUTH_ENABLED=1'
      - '--build-arg=NEXT_PUBLIC_GOOGLE_CLIENT_ID=$_GOOGLE_OAUTH_CLIENT_ID'
      - '--build-arg=NEXT_PUBLIC_AUTH_DOMAIN_HINT=$_AUTH_DOMAIN_HINT'
      - '-f'
      - 'ops/docker/Dockerfile.frontend'
      - '.'
    id: 'build-frontend'

  # 2. Push Container Image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '$_REGION-docker.pkg.dev/$PROJECT_ID/oncogemma-repo/frontend:latest']
    id: 'push-frontend'

  # 3. Deploy Next.js Frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'oncogemma-frontend'
      - '--image=$_REGION-docker.pkg.dev/$PROJECT_ID/oncogemma-repo/frontend:latest'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--cpu=1'
      - '--memory=1Gi'
      - '--cpu-throttling'
      - '--min-instances=0'
    id: 'deploy-frontend'

substitutions:
  _REGION: 'us-central1'
  _GOOGLE_OAUTH_CLIENT_ID: ''  # the same OAuth web client as the API
  _AUTH_DOMAIN_HINT: ''  # shown on the login page, e.g. example.org

options:
  logging: CLOUD_LOGGING_ONLY
