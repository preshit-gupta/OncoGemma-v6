# Evaluation Dataset Configurations (SPEC-02 §3)

datasets:
  tcga_brca_dx:
    chunk_size_bytes: 8388608  # 8 MiB per SPEC-02 §3.1
    api_url: "https://api.gdc.cancer.gov"
    timeout_seconds: 60.0
    specimen_type: "resection"
    mpp_source_with_file_mpp: "file"          # the slide's own openslide.mpp-x was read
    mpp_source_without_file_mpp: "dataset_doc"

  bcnb:
    mpp: null                     # µm/px of the JPG images (required)
    native_mag: null              # e.g. 20 or 40 (informational; used for slices)
    image_glob: "WSIs/*.jpg"
    clinical_file: null           # path to the clinical spreadsheet
    grade_field: null             # column name holding the grade
    grade_map: {}                 # raw value -> 1|2|3, e.g. {"I":1,"II":2,"III":3}
    tumor_polygons:
      path: null
      format: null                # annotation format and location
    split_source: "official"
    license_ref: null

  midogpp:
    # Resolution comes from each image's TIFF tags (midogpp.image_mpp): MIDOG++.json has no
    # scanner or resolution field, so there is no scanner -> µm/px table to keep here.
    categories:
      "mitotic figure": "MF"
      "not mitotic figure": "imposter" # the names in the published MIDOG++.json (re-checked 2026-09-30)
    specimen_type: "resection"
    mpp_source: "file"
    gt_label_source: "consensus"
    gt_label_confidence: "high"

  bcss:
    # Codes from BCSS meta/gtruth_codes.tsv (PathologyDataScience/BCSS), checked 2026-09-30.
    # Mask µm/px comes from each mask file name ("..._MPP-0.2500.png"); scanner and native
    # magnification are per TCGA slide, so they come from the tcga_brca_dx join, not from here.
    class_map:
      0: "outside_roi"
      1: "tumor"
      2: "stroma"
      3: "lymphocytic_infiltrate"
      4: "necrosis_or_debris"
      5: "glandular_secretions"
      6: "blood"
      7: "exclude"
      8: "metaplasia_NOS"
      9: "fat"
      10: "plasma_cells"
      11: "other_immune_infiltrate"
      12: "mucoid_material"
      13: "normal_acinus_or_duct"
      14: "lymphatics"
      15: "undetermined"
      16: "nerve"
      17: "skin_adnexa"
      18: "blood_vessel"
      19: "angioinvasion"
      20: "dcis"
      21: "other"
    specimen_type: "resection"
    mpp_source: "dataset_doc"
    gt_label_source: "expert_consensus"
    gt_label_confidence: "high"
