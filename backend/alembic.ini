# Alembic configuration (SPEC-01 §3.1).
# The database URL is not set here: env.py uses the application's engine
# (app.core.db), which reads DATABASE_URL, or CLOUD_SQL_CONNECTION_NAME and DB_PASSWORD.
#
# Run from backend/:
#   alembic upgrade head
#   alembic check
#   alembic revision --autogenerate --rev-id 0002_<slug> -m "<message>"

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
# Revision IDs are chosen explicitly (0001_v5_baseline, 0002_..., ...), so the
# file name is the revision ID.
file_template = %%(rev)s
# Split path lists on os.pathsep only: checkout paths may contain spaces or drive colons.
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
